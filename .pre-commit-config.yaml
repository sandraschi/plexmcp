repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/biomejs/pre-commit
    rev: v1.9.4
    hooks:
      - id: biome-check
        # Default entry already includes --write; do not use non-schema keys like additional_params

  # Semgrep is not run from pre-commit here: the official `repo: returntocorp/semgrep` hook
  # clones a huge repo and can fail on Windows (bad checkout in cache), and the `language: python`
  # install path mangles Windows shebang paths. Semgrep on Windows is also spotty (Unix-only
  # `resource` in some code paths). CI runs `semgrep scan` on Ubuntu (see .github/workflows/ci.yml).
  # Use WSL or `just lint` on Linux/macOS if you want local Semgrep.
