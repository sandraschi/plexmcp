[pytest]
# Pytest configuration for PlexMCP tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
pythonpath =
    src
    tests

# Asyncio configuration
asyncio_mode = auto

# Output options (coverage via `just test-cov` or explicit pytest --cov=...)
addopts =
    -v
    --strict-markers
    --tb=short

# Markers
markers =
    asyncio: marks tests as async (using pytest-asyncio)
    integration: marks tests as integration tests (requires real Plex server)
    unit: marks tests as unit tests (uses mocks, no external dependencies)
    fixture_db: marks tests that use fixture database (minimal Plex SQLite DB)
    slow: marks tests as slow running
    requires_plex: marks tests that require a real Plex server to be available
    mcp_http: marks tests that require the webapp backend HTTP (see conftest mcp_http_live)

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

