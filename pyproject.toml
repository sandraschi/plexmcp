[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "plexmcp"
version = "2.4.1"
description = "SOTA April 2026 industrialized FastMCP 3.2.0 server for Plex Media Server management with conversational AI, sampling, and agentic workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sandra Schipal", email = "sandra@schipal.at" }
]
keywords = ["mcp", "plex", "media", "streaming", "fastmcp", "glama-gold", "mcpb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "aiohttp>=3.9.0,<4.0.0",
    "aiofiles>=23.2.0,<24.0.0",
    "plexapi>=4.15.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "requests>=2.31.0",
    "pytz>=2024.1",
    "jsonschema>=4.21.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "lancedb>=0.4.0",
    "fastembed>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "rich>=13.0.0",
    "ruff>=0.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "black>=24.0.0,<25.0.0",
    "isort>=5.12.0,<6.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0,<2.0.0",
    "bandit>=1.7.0,<2.0.0",
    "safety>=2.3.0,<3.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
    "pre-commit>=3.6.0"
]

[project.scripts]
plex-mcp = "plex_mcp.server:main"

[project.urls]
Homepage = "https://github.com/yourusername/plex-mcp"
Repository = "https://github.com/yourusername/plex-mcp.git"
Documentation = "https://github.com/yourusername/plex-mcp#readme"
Changelog = "https://github.com/yourusername/plex-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/yourusername/plex-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/plex_mcp"]

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "_llm_test_scripts",
    ".pre-commit-cache",
    "webapp/backend/test_*.py",
    "webapp/backend/inspect_fastmcp.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "T20", "RET", "SIM", "ARG", "PTH", "TRY"]
ignore = [
    "E501",
    "B008",
    "TRY003",
    "TRY300",
    "TRY301",
    "TRY400",
    "TRY401",
    "ARG001",
    "ARG002",
    "A002",
    "PTH100",
    "PTH110",
    "PTH118",
    "PTH120",
    "PTH123",
    "PTH202",
    "S101",
    "B904",
    "S110",
    "S112",
    "T201",
    "S105",
    "S106",
    "S311",
    "S314",
    "RET504",
    "SIM108",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"src/plex_mcp/app.py" = ["N802", "N816"]
"src/plex_mcp/fleet_tool_metrics.py" = ["E402"]
"src/plex_mcp/api/core.py" = ["A001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pyinstaller>=6.21.0",
    "pytesseract>=0.3.13",
    "pywinauto>=0.6.9",
]
