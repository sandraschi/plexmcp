name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff Check
        run: uv run ruff check .

      - name: Biome Check
        run: cd webapp/frontend && npx @biomejs/biome check .

      - name: Semgrep Scan
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --error .

  linkcheck:
    name: Markdown links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-concurrency 8 --exclude localhost --exclude 127.0.0.1 --exclude host.docker.internal --exclude 'https://plexmcp.example.com' --exclude 'https://api.plexmcp.example.com' README.md docs CHANGELOG.md webapp/README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: webapp/frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: webapp/frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e smoke
        working-directory: webapp/frontend
        env:
          CI: "true"
        run: npm run test:e2e

  test:
    name: Mocked Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run Pytest (Mocked)
        env:
          GITHUB_ACTIONS: "true"
          PLEX_TOKEN: "" # Ensure empty to trigger skips in integration tests
          PLEX_URL: ""
        run: uv run pytest tests --cov=src/plex_mcp --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
