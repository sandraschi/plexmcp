name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests (mock-only; integration / MCP HTTP skipped in GITHUB_ACTIONS)
        env:
          GITHUB_ACTIONS: "true"
          PLEXMCP_ALLOW_LOGGING: "1"
        run: uv run pytest tests -q --override-ini "addopts="
