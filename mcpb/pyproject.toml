[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plexmcp"
version = "2.4.1"
description = "FastMCP 3.4+ server for Plex Media Server management with conversational AI, sampling, and agentic workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sandra Schipal", email = "sandra@schipal.at" }
]
keywords = ["mcp", "plex", "media", "streaming", "fastmcp"]

dependencies = [
    "fastmcp>=3.4.2",
    "prefab-ui>=0.14.0",
    "aiohttp>=3.9.0,<4.0.0",
    "plexapi>=4.15.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "requests>=2.31.0",
    "pytz>=2024.1",
    "jsonschema>=4.21.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
]

[project.scripts]
plex-mcp = "plex_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plex_mcp"]
